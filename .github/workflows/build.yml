name: Build

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# The build reads the repository and nothing else.
permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Don't leave the token in .git/config for the install and build steps.
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Cheap, and it answers before anything slow starts.
            - name: Check the manifest's version matches the package's
              run: pnpm release:check

            - name: Check formatting
              run: pnpm exec prettier --check .

            - name: Lint
              run: pnpm exec eslint

            - name: Type-check, including the tests
              run: pnpm typecheck

            - name: Build and test
              run: pnpm test

            # A bundle that still reaches for a package would load on a developer's machine, where
            # node_modules is right there, and fail on every Stream Deck, where it is not. Node's own
            # modules are the only imports allowed to survive bundling.
            - name: Check the bundle stands alone
              working-directory: com.maroonedsoftware.bluos.sdPlugin/bin
              run: |
                  set -euo pipefail
                  test -f plugin.js
                  grep -qx '{ "type": "module" }' package.json || { echo "::error::bin/package.json does not make the bundle an ES module"; exit 1; }
                  # JavaScript in single quotes: its ${...} is a template string for Node, not the shell's.
                  # shellcheck disable=SC2016
                  node --input-type=module -e '
                      import { builtinModules } from "node:module";
                      import { readFileSync } from "node:fs";
                      const text = readFileSync("plugin.js", "utf8");
                      // What ws reaches for inside a try and runs without.
                      const optional = new Set(["bufferutil", "utf-8-validate"]);
                      const named = [...text.matchAll(/(?:\bfrom\s*|\bimport\(\s*|__require\(\s*|\brequire\(\s*)["\x27]([^"\x27.][^"\x27]*)["\x27]/g)].map(m => m[1]);
                      const strays = [...new Set(named)].filter(name => !builtinModules.includes(name.replace(/^node:/, "")) && !optional.has(name));
                      if (strays.length > 0) {
                          console.log(`::error::the bundle reaches for packages it did not inline: ${strays.join(", ")}`);
                          process.exit(1);
                      }
                  '

            # This fetches the manifest's URL and SupportURL, so it needs the network, which is why
            # it is here and not in `pnpm test`.
            - name: Validate the plugin
              run: pnpm validate

            - name: Pack it without writing the installer
              run: pnpm exec streamdeck pack com.maroonedsoftware.bluos.sdPlugin --dry-run --no-update-check
