version: 2

updates:
    # The workflows' actions, and nothing else. An action that is not GitHub's own is pinned to a
    # commit with its version in a trailing comment, because a tag is a pointer its owner can move and
    # the release job holds a token that can write. A pin nobody moves goes stale, so this moves them,
    # comment included.
    #
    # One pull request a week for all of them, and nothing younger than a week: a compromised release
    # is usually noticed and pulled inside a few days.
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns:
                  - '*'
      commit-message:
          prefix: ci
