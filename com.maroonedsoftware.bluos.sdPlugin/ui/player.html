<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>BluOS</title>
        <style>
            /* The Stream Deck panel's own look, by hand. The app gives a plain page with no styling
               of its own, and these are the colours and the 92px label column its other panels use. */
            :root {
                color-scheme: dark;
                --bg: #2d2d2d;
                --ink: #d8d8d8;
                --quiet: #969696;
                --line: #3d3d3d;
                --field: #3d3d3d;
                --focus: #0080ff;
                --ok: #5ac467;
                --bad: #f08c78;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 12px 16px 16px;
                background: var(--bg);
                color: var(--ink);
                font:
                    9pt / 1.5 -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Tahoma,
                    sans-serif;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 8px;
            }
            .row > label {
                flex: 0 0 92px;
                text-align: right;
                color: var(--quiet);
            }
            input[type='text'] {
                flex: 1 1 auto;
                min-width: 0;
                padding: 4px 6px;
                border: 1px solid var(--line);
                border-radius: 3px;
                background: var(--field);
                color: var(--ink);
                font: inherit;
            }
            input[type='text']:focus {
                outline: none;
                border-color: var(--focus);
            }
            button {
                padding: 4px 10px;
                border: 1px solid var(--line);
                border-radius: 3px;
                background: var(--field);
                color: var(--ink);
                font: inherit;
                cursor: pointer;
            }
            button:hover {
                border-color: var(--focus);
            }
            .status {
                margin: 2px 0 0 100px;
                min-height: 1.5em;
                color: var(--quiet);
            }
            .status.ok {
                color: var(--ok);
            }
            .status.bad {
                color: var(--bad);
            }
            .hint {
                margin: 10px 0 0 100px;
                color: var(--quiet);
            }
        </style>
    </head>
    <body>
        <div class="row">
            <label for="address">Player</label>
            <input id="address" type="text" placeholder="192.168.1.100" autocapitalize="off" autocomplete="off" spellcheck="false" />
            <button id="test" type="button">Test</button>
        </div>
        <p id="status" class="status"></p>
        <p class="hint">The player’s IP address, or its name ending in .local. Add <code>:port</code> only if it is not on 11000.</p>
        <script src="player.js"></script>
    </body>
</html>
